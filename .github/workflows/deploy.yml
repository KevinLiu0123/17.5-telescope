# 每次推送到 main：產生 RSS（feed.xml）→ 發佈整個網站到 GitHub Pages
# 使用前：repo 的 Settings → Pages → Source 要選「GitHub Actions」
name: 發佈網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: 產生 RSS
        run: node scripts/build-feed.js "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
